name: Recherche Moat Trimestrielle

on:
  schedule:
    - cron: '0 8 1 1,4,7,10 *'   # 1er jour de chaque trimestre, 10h Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-js-writer
  cancel-in-progress: false

jobs:
  moat-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recherche moat (toutes les Grade A, sans plafond)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python quarterly_moat_research.py

      - name: Commit et push
        run: |
          git config user.name "PEA Bot"
          git config user.email "bot@pea.fr"
          git add data.js index.html
          git diff --staged --quiet || (
            git commit -m "🔎 Recherche moat trimestrielle $(date '+%Y-%m-%d')" &&
            git fetch origin main --quiet &&
            git pull --rebase origin main &&
            git push
          )
