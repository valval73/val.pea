name: Concurrents (comparatif chiffre)

on:
  schedule:
    # Dimanche 06h41 UTC : les chiffres sont prets pour la routine du mois
    - cron: '41 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peers-writer
  cancel-in-progress: false

jobs:
  peers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests pytz --quiet
      - run: python fetch_peers.py
      - run: python anticipation.py
      - name: Commit if changed
        run: |
          git config --local user.email "valpea@users.noreply.github.com"
          git config --local user.name "VAL.PEA"
          if ! node -e "new Function(require('fs').readFileSync('peers.js','utf8'))"; then
            echo "peers.js INVALIDE : rien n'est publie"; exit 1
          fi
          python -c "import json; json.load(open('anticipation.json'))"
          git add peers.js anticipation.json
          if git diff --cached --quiet; then echo "Nothing to commit"; else
            git commit -m "Concurrents et anticipation $(date '+%Y-%m-%d') [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
