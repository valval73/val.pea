name: Mail routine hebdo (sans IA)

on:
  schedule:
    - cron: '0 6 * * 6'   # Samedi 8h Paris (ete) -- MAJ complete puis mail routine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-js-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dependances
        run: pip install yfinance requests

      - name: MAJ prix + fundamentals (hebdomadaire, vendredi soir)
        run: python fetch_fundamentals.py || true

      - name: Mail routine (calcule sans IA, 06/10/2026)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python routine_mail.py

      - name: Supprimer fichiers temporaires
        run: |
          git rm -f --ignore-unmatch "*.docx" alert_preview.html mail_preview.html weekly_preview.html 2>/dev/null || true
          rm -f *.docx alert_preview.html mail_preview.html weekly_preview.html routine_preview.html 2>/dev/null || true

      - name: Commit et push
        run: |
          git config user.name "PEA Bot"
          git config user.email "bot@pea.fr"
          git add index.html data.js fundamentals_log.json routine_state.json 2>/dev/null || true
          git add .gitignore 2>/dev/null || true
          git diff --staged --quiet || (
            git commit -m "Update $(date '+%d/%m %H:%M') [skip ci]" &&
            git fetch origin main --quiet &&
            git pull --rebase origin main &&
            git push
          )

