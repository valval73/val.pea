name: Test des regles de vente
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ventes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy pytz requests --quiet
      - name: Regles de vente (14/11/2026)
        run: |
          mkdir -p backtests
          for v in jamais prix prix_tout comptes stop30; do
            KNIFE=actuel IRRMIN=12 SELL=$v OUT=backtests/vente_$v.json python backtest_paliers.py || echo "echec vente $v"
          done
      - run: |
          git config user.name "VAL.PEA"; git config user.email "valpea@users.noreply.github.com"
          git add backtests/
          if git diff --cached --quiet; then echo "rien"; else
            git commit -m "Test des regles de vente $(date '+%Y-%m-%d') [skip ci]"
            git pull --rebase --autostash origin main && git push
          fi
