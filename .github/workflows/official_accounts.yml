name: Comptes officiels (2e source)
on:
  schedule:
    - cron: '30 5 * * 1'   # lundi 7h30 Paris, apres la mise a jour complete du dimanche
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-js-writer
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --quiet
      - run: python official_accounts.py
      - run: |
          git config user.name "VAL.PEA"; git config user.email "valpea@users.noreply.github.com"
          git add data.js lei_map.json official_check.json
          if git diff --cached --quiet; then echo "rien"; else
            git commit -m "Comptes officiels $(date '+%Y-%m-%d') [skip ci]"
            git pull --rebase origin main && git push
          fi
