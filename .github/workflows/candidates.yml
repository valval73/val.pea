name: Candidats (filtre qualite sur la banque de noms)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-js-writer
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests pytz --quiet
      - name: Filtre qualite sur les candidats
        run: python screen_candidates.py
      - name: Commit
        run: |
          git config --local user.email "valpea@users.noreply.github.com"
          git config --local user.name "VAL.PEA"
          git add candidats_resultats.json
          if git diff --cached --quiet; then echo "Rien"; else
            git commit -m "Candidats : filtre qualite $(date '+%Y-%m-%d') [skip ci]"
            git pull --rebase origin main
            git push
          fi
