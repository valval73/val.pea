name: Sonde sources de donnees
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests yfinance pandas --quiet
      - run: python tools/probe_sources.py
      - run: |
          git config user.name "VAL.PEA"; git config user.email "valpea@users.noreply.github.com"
          git add probe_sources.json && git commit -m "Sonde sources [skip ci]" && git pull --rebase origin main && git push || true
