name: Test des paliers sur le passe (mensuel)
on:
  schedule:
    - cron: '0 5 2 * *'   # 2 de chaque mois
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy pytz requests --quiet
      - run: python backtest_paliers.py
      - run: |
          git config user.name "VAL.PEA"; git config user.email "valpea@users.noreply.github.com"
          git add backtest_paliers.json
          if git diff --cached --quiet; then echo "rien"; else
            git commit -m "Test des paliers $(date '+%Y-%m-%d') [skip ci]"
            git pull --rebase origin main && git push
          fi
