name: Veille Sociale Hebdomadaire

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  social-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests --quiet
      - name: Run social watch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD:    ${{ secrets.GMAIL_PASSWORD }}
          RECIPIENT_EMAIL:   ${{ secrets.RECIPIENT_EMAIL }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_social.py
      - name: Commit logs
        run: |
          git config --local user.email "valpea-bot@github.com"
          git config --local user.name "VAL.PEA Bot"
          git add social_log.json social_preview.html 2>/dev/null || true
          git diff --staged --quiet || (
            git commit -m "Veille sociale $(date '+%Y-%m-%d') [skip ci]" && git push
          )
