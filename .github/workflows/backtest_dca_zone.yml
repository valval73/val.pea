name: Test du DCA en zone d achat
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/backtest_dca_zone.yml
permissions:
  contents: write
jobs:
  dca:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy pytz requests --quiet
      - name: Methode du screener (paliers) sur la meme periode disponible
        run: KNIFE=actuel IRRMIN=12 OUT=backtests/dca_zone.json python backtest_paliers.py || echo "echec paliers"
      - run: |
          git config user.name "VAL.PEA"; git config user.email "valpea@users.noreply.github.com"
          git add backtests/
          if git diff --cached --quiet; then echo "rien"; else
            git commit -m "Test du DCA en zone $(date '+%Y-%m-%d') [skip ci]"
            git pull --rebase --autostash origin main && git push
          fi
