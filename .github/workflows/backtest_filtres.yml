name: Tests de regles (variantes)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  filtres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy pytz requests --quiet
      - name: Variantes
        run: |
          mkdir -p backtests
          for r in 0 8 10 12; do
            KNIFE=actuel IRRMIN=$r OUT=backtests/rendement_min_$r.json python backtest_paliers.py || echo "echec $r"
          done
      - run: |
          git config user.name "VAL.PEA"; git config user.email "valpea@users.noreply.github.com"
          git add backtests/
          if git diff --cached --quiet; then echo "rien"; else
            git commit -m "Test du filtre couteau $(date '+%Y-%m-%d') [skip ci]"
            git pull --rebase --autostash origin main && git push
          fi
