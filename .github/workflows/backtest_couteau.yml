name: Robustesse du filtre couteau
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  couteau:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy pytz requests --quiet
      - name: Filtre couteau x sous-periodes (14/11/2026)
        run: |
          mkdir -p backtests
          for per in "2021-01 2023-12 a" "2024-01 2026-12 b"; do set -- $per
            for k in actuel aucun rebond; do
              START=$1 END=$2 KNIFE=$k IRRMIN=12 OUT=backtests/couteau_${k}_$3.json python backtest_paliers.py || echo "echec $k $3"
            done
          done
      - run: |
          git config user.name "VAL.PEA"; git config user.email "valpea@users.noreply.github.com"
          git add backtests/
          if git diff --cached --quiet; then echo "rien"; else
            git commit -m "Robustesse filtre couteau $(date '+%Y-%m-%d') [skip ci]"
            git pull --rebase --autostash origin main && git push
          fi
